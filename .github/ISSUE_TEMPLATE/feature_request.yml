name: پیشنهاد قابلیت جدید / Feature Request
description: پیشنهاد ایده، بهبود یا قابلیت جدید برای برنامه سهیل
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ایده‌ها و پیشنهادات شما به بهتر شدن برنامه سهیل کمک می‌کند.
  - type: textarea
    id: problem
    attributes:
      label: انگیزه یا نیاز فعلی
      description: چه مسئله یا نیازی باعث این پیشنهاد شده است؟
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: راه‌حل یا قابلیت پیشنهادی
      description: توضیح دقیق از قابلیتی که مایلید اضافه شود.
    validations:
      required: true
