name: SOH3IL CI/CD Pipeline

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_build:
    name: Unit Tests & Build Multi-Arch APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests (TDD Verification)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Signed Release APKs (Multi-Arch Splits)
        run: ./gradlew assembleRelease --stacktrace

      - name: Package & Name Release APKs
        run: |
          VERSION_MAJOR=$(grep "VERSION_MAJOR" version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_MINOR=$(grep "VERSION_MINOR" version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_PATCH=$(grep "VERSION_PATCH" version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION="$VERSION_MAJOR.$VERSION_MINOR.$VERSION_PATCH"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          mkdir -p release-apks

          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            filename=$(basename "$apk")
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$apk" "release-apks/SOH3IL-v${VERSION}-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$apk" "release-apks/SOH3IL-v${VERSION}-armeabi-v7a.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              cp "$apk" "release-apks/SOH3IL-v${VERSION}-x86_64.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              cp "$apk" "release-apks/SOH3IL-v${VERSION}-universal.apk"
            else
              cp "$apk" "release-apks/SOH3IL-v${VERSION}-universal.apk"
            fi
          done

          echo "Packaged APKs:"
          ls -la release-apks/

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOH3IL-v${{ env.APP_VERSION }}-APKs
          path: release-apks/*.apk
          retention-days: 14

      - name: Upload Debug APK Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SOH3IL-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Publish GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SOH3IL v${{ env.APP_VERSION }}
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
